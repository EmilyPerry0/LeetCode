name: Update Personal Leetcode Stats
on:
  push:
    branches:
      - main

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Setup python 3.13
        uses: actions/checkout@v7
        uses: actions/setup-python@v7
        with:
          python-version: '3.13' 
      - name: Get stats
        run:
          python -c "import requests; r = requests.get('https://leetcodeapi-v1.vercel.app/questions/emilyperry0'); with open("README.md", "w") as f: f.write(r.json())"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Update LeetCode stats via Workflow"
          git push