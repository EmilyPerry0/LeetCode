name: Update Personal Leetcode Stats
on:
  push:
    branches:
      - main

jobs:
  update-stats:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install requests

      - name: Get stats
        run: |
          python -c "
          import requests, json
          r = requests.get('https://alfa-leetcode-api.onrender.com/emilyperry0/solved')
          data = r.json()
          solved = data['solvedProblem']
          easy = data['easySolved']
          medium = data['mediumSolved']
          hard = data['hardSolved']
          with open('README.md', 'w') as f:
              f.write(f"Total Problems Solved: {solved}\n\nEasy: {easy}\nMedium: {medium}\nHard: {hard}")
          "

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Update LeetCode stats [skip ci]"
          git push